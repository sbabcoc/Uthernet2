buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.sonatype.plexus:plexus-sec-dispatcher:1.4'
        classpath 'org.codehaus.plexus:plexus-container-default:2.1.1'
        classpath 'org.sonatype.plexus:plexus-cipher:1.7'
    }
}

import groovy.xml.XmlParser
import org.sonatype.plexus.components.sec.dispatcher.DefaultSecDispatcher
import org.sonatype.plexus.components.cipher.DefaultPlexusCipher

plugins {
    id 'java'
    id 'maven-publish'
    id 'signing'

    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
    id 'pl.allegro.tech.build.axion-release' version '1.18.16'
}

group = 'com.nordstrom.ui-tools'
description = 'Uthernet2'

repositories {
    mavenLocal()
    mavenCentral()
}

/*
 * Credential lookup, the same as ReplicApple2Plus's: reads
 * ~/.m2/settings.xml, decrypting any encrypted value found there via
 * ~/.m2/settings-security.xml.
 */
def getMavenServer(String serverId) {
    def settingsFile = new File(System.getProperty("user.home"), ".m2/settings.xml")
    if (!settingsFile.exists()) return null

    def settings = new XmlParser().parse(settingsFile)
    def server = settings.servers.server.find { it.id.text() == serverId }

    if (server) {
        def dispatcher = new DefaultSecDispatcher()
        dispatcher._cipher = new DefaultPlexusCipher()

        def securityFile = new File(System.getProperty("user.home"), ".m2/settings-security.xml")
        System.setProperty("settings.security", securityFile.absolutePath)

        def decrypt = { String val ->
            if (val == null) return null
            return dispatcher._cipher.isEncryptedString(val) ? dispatcher.decrypt(val) : val
        }

        return [
            username  : server.username?.text(),
            password  : decrypt(server.password?.text()),
            passphrase: decrypt(server.passphrase?.text())
        ]
    }

    return null
}

scmVersion {
    tag {
        prefix = 'v'
    }
    repository {
        def githubNode = getMavenServer('github')
        if (githubNode) {
            customUsername.set(githubNode.username)
            customPassword.set(githubNode.password)
        }
    }
}

version = scmVersion.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withJavadocJar()
    withSourcesJar()
}

/*
 * ReplicApple2Plus supplies the SlotCard contract at compile time and is
 * already present at run time (it loads this jar as a plugin), so it is
 * compileOnly, never bundled -- and so the published POM declares no
 * dependency on it. Its version is set in gradle.properties: a release
 * must build against a released ReplicApple2Plus, never a SNAPSHOT.
 */
dependencies {
    compileOnly "com.nordstrom.ui-tools:ReplicApple2Plus:${replicApple2PlusVersion}"
    testImplementation "com.nordstrom.ui-tools:ReplicApple2Plus:${replicApple2PlusVersion}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

/*
 * Captures the screenshots in docs/images: runs the utilities on the 6502,
 * connected to The Norse Wanderer BBS and gopher.floodgap.com (so it needs
 * Internet access), and draws the Soft-70 screen with ReplicApple2Plus's
 * Hi-Res renderer.
 */
tasks.register('screenshots', JavaExec) {
    description = 'Captures the utilities\' screenshots in docs/images'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.nordstrom.uthernet.apple.Screenshots'
    args 'docs/images'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'Uthernet2'
                groupId = project.group
                artifactId = rootProject.name
                version = project.version
                packaging = 'jar'
                description = 'An emulation of the a2RetroSystems Uthernet II, a W5100 Ethernet card for the Apple II, ' +
                    'as a plug-in card for ReplicApple2Plus.'
                url = 'https://github.com/sbabcoc/Uthernet2'

                scm {
                    connection = 'scm:git:https://github.com/sbabcoc/Uthernet2.git'
                    developerConnection = 'scm:git:https://github.com/sbabcoc/Uthernet2.git'
                    url = 'https://github.com/sbabcoc/Uthernet2/tree/main'
                    tag = 'HEAD'
                }

                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }

                developers {
                    developer {
                        id = 'scoba'
                        name = 'Scott Babcock'
                        email = 'scoba@hotmail.com'
                    }
                }
            }
        }
    }
}

/* Signing */
signing {
    if (project.hasProperty('signing.keyId')) {
        def keyId = project.getProperty('signing.keyId')
        def gpgNode = getMavenServer(keyId)
        def secret = gpgNode?.passphrase

        if (secret) {
            useGpgCmd()
            project.ext.set("signing.gnupg.passphrase", secret)
            project.ext.set("signing.gnupg.arguments", "--batch,--pinentry-mode,loopback")
        }
    }
    sign publishing.publications.mavenJava
}

/* Install alias */
tasks.register('install') {
    dependsOn tasks.named('publishToMavenLocal')
    group = tasks.named('publishToMavenLocal').get().group
    description = "[alias] publish to Maven Local"
}

/* Nexus publishing */
nexusPublishing {
    packageGroup = 'com.nordstrom'
    repositories {
        ossrh {
            def ossrhNode = getMavenServer('ossrh')
            username = ossrhNode?.username
            password = ossrhNode?.password
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            snapshotRepositoryUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/content/repositories/snapshots/"))
            if (project.hasProperty('ossrhStagingProfileId')) {
                stagingProfileId = ossrhStagingProfileId
            }
        }
    }
}
