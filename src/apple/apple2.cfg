# Memory layout for the utilities, the same under DOS 3.3 and ProDOS
# BASIC.SYSTEM, which both leave $0800-$95FF to programs:
#   $80-$BF      zero page, saved on entry and restored on exit
#   $0800-$0F7F  the 80x24 screen buffer (a fixed address, so tests can read it)
#   $0F80-$1FFF  other uninitialized data
#   $2000-$3FFF  Hi-Res page 1, for Soft-70
#   $4000-$95FF  the program (BRUN loads it at $4000), then its BSS; the
#                Gopher client keeps documents in what's left
MEMORY {
    ZP:   file = "", start = $0080, size = $0040;
    LOW:  file = "", start = $0800, size = $1800;
    MAIN: file = %O, start = $4000, size = $5600;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    SCREEN:   load = LOW,  type = bss;
    LOWBSS:   load = LOW,  type = bss;
    STARTUP:  load = MAIN, type = ro;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    BSS:      load = MAIN, type = bss, define = yes;
}
